name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The token gets only what deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push does not cancel one already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Type-checks, builds, prerenders, and fails if any evidence link is broken.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
